# Prototype AI Research · CI
#
# WHAT THIS IS
# ------------
# A **quality gate only**. CI answers "is this tree still internally consistent
# and green?", and nothing else. It does not build a preview environment, it
# does not promote anything, and it holds no deployment credentials:
#
#   - 部署仍由 **Vercel Git Integration** 负责 —— push/tag 触发平台自己的构建，
#     Vercel 是部署的一方，CI 不是。
#   - 本 workflow **不调用任何 Vercel CLI、不读取任何部署 token/bypass secret**，
#     也不创建 Preview/Production。`pnpm qa:online`（REMOTE 观察者）需要用户
#     显式提供 secret，因此永远不在 CI 里自动运行。
#   - 部署授权是**独立的一次人工决定**（见 AGENTS.md 管理块与
#     docs/vercel-bootstrap.md 第 0 节）。让 CI 顺手部署会把「人的决定」变成构建
#     的副作用，这正是要避免的。
#
# 这条边界在 v1.2 之前写在 AGENTS.md 的一条禁令里：「禁止 GitHub Actions」。
# 那是一条**过宽**的规则——它连质量门一起禁掉了，而质量门正是 CI 该做的事。
# v1.3 把它换成准确的那一条：**托管 CI 允许，部署自动化仍然禁止**，
# 由 `pnpm factory:agents` 机器校验（本文件不得出现 Vercel CLI/凭据）。
#
# WHY IT IS SELF-CONTAINED (and how to switch later)
# -------------------------------------------------
# The intended end state is to call the shared workflow from the root control
# repo:
#
#     # uses: skillre/prototype-factory-control/.github/workflows/reusable-prototype-ci.yml@v1
#
# That call is **not** enabled here. Verified on 2026-09-15, four ways, all
# pointing at "does not exist": the GitHub API and the web URL for
# `skillre/prototype-factory-control` both return 404; the path does not exist
# locally; `grep prototype-factory-control` over the whole workspace has 0 hits.
# The real control plane is the workspace root itself, and it is not published
# either — `git remote -v` is empty, `main` has no commits at all, and there is no
# `.github/` directory there, so `reusable-prototype-ci.yml` exists neither
# locally nor on any remote.
#
# A `uses:` pointing at a repository that does not exist makes the workflow file
# invalid, so *every* run fails before any job starts — CI would be dead, not
# merely degraded. The state above is recorded as `upstream/control-repo`
# (value: null) in `factory.lock.json`, and `pnpm factory:agents` enforces the
# pairing: the moment a real `uses:` line is added, the lock must stop calling it
# unknown. So the switch is a two-line change plus a lock update — deliberate,
# and impossible to do by accident.
#
# Note also that this repository's own remote is unpublished, so this workflow
# has no runtime yet. It is written now so the contract is reviewable, not
# because it is already running.
#
# SERIALIZATION (non-negotiable)
# ------------------------------
# `pnpm test` and `pnpm qa` must never run concurrently: Next 16's dev server
# locks per *project* (`.next/dev/lock`), not per port, so two of them in one
# checkout fight over the same tree. `browser-qa` therefore `needs:` the gate job
# — serial by construction, not by ordering luck. `pnpm factory:agents` checks
# that this stays true.
#
# PORT
# ----
# QA runs on `.qa/qa.config.mjs`'s `QA_PORT = 3230`. It used to be 3200, which
# this repository shared with the baseline, s1 and kits — see catalog/ports.json.
# Inside CI the runner is isolated, but the value is pinned anyway: a local and a
# CI run must mean the same thing.
#
# KITS REGISTRY (the manifest gate's upstream source)
# -------------------------------------------------
# `pnpm factory:manifest` is only a *verification* when a registry is reachable;
# without one it can still check shape, self-consistency, deviations and budget,
# but it must not be described as having compared anything upstream. This
# workflow therefore has two modes and names which one it used:
#
#   - `KITS_REPO_TOKEN` configured → `skillre/prototype-kits` is checked out at a
#     pinned commit (`.prototype-kits`) and the cross-check runs for real;
#   - otherwise → the gate runs in honest mode and the step carries a
#     `upstream-unavailable` warning annotation. A green step here means "L1/L2
#     passed and the upstream comparison did not happen", which is what it says.
#
# The gate NEVER runs in a mode that reports `verified` without an upstream: the
# status word comes from `scripts/validate-manifest.mjs`, not from this file.

name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from `packageManager` in package.json — the same
      # field the local toolchain uses. No second place to update.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # First gate, on purpose: the agent policy must hold before anything else
      # is allowed to be called green.
      - name: Agent policy gate
        run: pnpm factory:agents

      - name: Initialization boundary
        run: pnpm factory:init

      - name: Product semantic contract
        run: pnpm factory:contract

      # Honest either way: with no Kits install it reports [not-installed] and
      # says it did not compare against upstream, rather than claiming a pass.
      - name: Kits doctor
        run: pnpm qa:doctor

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Playwright E2E
        run: pnpm test

      # ---- Visual Manifest gate ----------------------------------------------
      # Two modes, both explicit, and neither of them a fake PASS:
      #
      #   1. WHEN a read token for the sibling Kits repo is configured
      #      (`KITS_REPO_TOKEN`), the registry is checked out at a **pinned
      #      commit** — a reproducible source, not "whatever main is today". It
      #      lands in a subdirectory of the workspace because `actions/checkout`
      #      refuses paths outside it, and it is checked out *after* lint /
      #      typecheck / build on purpose: a second source tree must never be
      #      scanned as if it were this one.
      #   2. OTHERWISE the gate runs in its honest mode: it prints
      #      `[upstream-unavailable]` and says in as many words that **no
      #      upstream comparison was performed**, and the step emits a warning
      #      annotation so that state shows up in the run summary instead of only
      #      in the log. The installed state is still checked, by `pnpm qa:doctor`
      #      above, against `lib/kits/kits.lock.json`.
      #
      # Level 1 + level 2 (shape · self-consistency · deviations · budget) run in
      # both modes: they need no upstream at all.
      - name: Check out Prototype Kits (pinned) for the manifest cross-check
        if: ${{ secrets.KITS_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: skillre/prototype-kits
          ref: 0ceb04d94f5d1d540fc0b05b1c17dcf1304c7888
          token: ${{ secrets.KITS_REPO_TOKEN }}
          path: .prototype-kits

      - name: Visual manifest gate
        run: |
          if [ -f .prototype-kits/registry/assets.json ]; then
            echo "Kits registry: pinned checkout at .prototype-kits — running the upstream cross-check."
            pnpm factory:manifest --kits .prototype-kits
          else
            echo "::warning title=upstream-unavailable::prototype-kits 未在场（未配置 KITS_REPO_TOKEN）：factory:manifest 只做了 L1/L2（结构 · 自洽 · deviations · budget），**未做上游比对**——stylePack / signatureComponents / effects 是否 approved、pack profile 是否一致，全部未验证。这不是通过。"
            pnpm factory:manifest
          fi

  browser-qa:
    name: Browser QA (serial)
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Never runs at the same time as the E2E job above (`needs:`), and never
      # touches a deployed URL — this only sweeps the server it starts itself.
      - name: Browser QA sweep
        run: pnpm qa
